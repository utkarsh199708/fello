[project]
name = "app"
version = "0.1.0"
description = "Ranked Monday list of accounts at risk, for customer success managers."
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3,<4",
    "fastapi>=0.143.3",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
# An application run from the checkout with `python -m app`, never built as a wheel.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
