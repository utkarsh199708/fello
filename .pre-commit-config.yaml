# Secret scanning on every commit. Set up once per clone:
#   uv tool install pre-commit
#   pre-commit install
# The gitleaks hook builds from source. pre-commit fetches a Go toolchain if none is installed.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
