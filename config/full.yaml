# Full config: five tenant profiles, about 5,000 accounts and 200,000 events (PLAN.md section 5).
# Every date the generator and the evaluator need lives here. No code reads the wall clock.
# Timestamps are quoted ISO 8601 strings in UTC.
name: full
seed: 20261016

dates:
  horizon_start: "2023-10-02T00:00:00Z"
  horizon_end: "2026-12-14T00:00:00Z"   # the live tail: events keep arriving up to this date
  train_as_of: "2026-10-12T00:00:00Z"   # a Monday; the model trains on what was visible then
  eval_as_of: "2026-10-12T00:00:00Z"    # a Monday; Step 4 moves it to hold out later renewals

model:
  anchor_warmup_weeks: 12

defaults:
  top_k: 8
  contraction_threshold: 0.30
  accounts_per_csm: 120
  history_months: 36

tenants:
  - slug: t1
    name: Northwind Cloud
    segment: enterprise
    accounts: 2000
    base_churn: 0.08
    sources:
      salesforce: "2023-10-02T00:00:00Z"
      zendesk: "2023-10-02T00:00:00Z"
      product: "2023-10-02T00:00:00Z"
      stripe: "2023-10-02T00:00:00Z"
      gmail: "2023-10-02T00:00:00Z"
  - slug: t2
    name: Harbor Software
    segment: mid-market
    accounts: 1200
    base_churn: 0.12
    sources:   # no Gmail: this tenant never connected it
      salesforce: "2023-10-02T00:00:00Z"
      zendesk: "2023-10-02T00:00:00Z"
      product: "2023-10-02T00:00:00Z"
      stripe: "2023-10-02T00:00:00Z"
  - slug: t3
    name: Lumen Retail Systems
    segment: mid-market
    accounts: 900
    base_churn: 0.12
    sources:   # no Stripe: ARR and renewal outcome come from Salesforce only
      salesforce: "2023-10-02T00:00:00Z"
      zendesk: "2023-10-02T00:00:00Z"
      product: "2023-10-02T00:00:00Z"
      gmail: "2023-10-02T00:00:00Z"
  - slug: t4
    name: Copper Desk
    segment: smb
    accounts: 600
    base_churn: 0.20
    sources:   # Zendesk was connected late: 14 months before train_as_of
      salesforce: "2023-10-02T00:00:00Z"
      zendesk: "2025-08-12T00:00:00Z"
      product: "2023-10-02T00:00:00Z"
      stripe: "2023-10-02T00:00:00Z"
      gmail: "2023-10-02T00:00:00Z"
  - slug: t5
    name: Pine Launch
    segment: startup
    accounts: 300
    base_churn: 0.15     # unknown yet: five months of history show no renewal at all
    history_months: 5
    sources:   # no Zendesk
      salesforce: "2026-05-12T00:00:00Z"
      product: "2026-05-12T00:00:00Z"
      stripe: "2026-05-12T00:00:00Z"
      gmail: "2026-05-12T00:00:00Z"

# Generator knobs. See docs/decisions/step-1-log.md for why these values.
generator:
  unassigned_rate: 0.01          # share of accounts with no CSM owner
  activity_sigma: 0.7            # heavy tail of per-account ticket and mail volume
  health:                        # latent monthly health: AR(1) with drift and rare shocks
    initial_sd: 0.8
    phi: 0.92
    drift_sd: 0.04
    noise_sd: 0.25
    shock_prob: 0.012
    shock_min: 0.8
    shock_max: 1.6
  churn:                         # logit(churn) = intercept + health_coef * health + unobserved
    health_coef: -1.6
    unobserved_sd: 1.0
  contraction:                   # separate draw, given the account did not churn
    intercept: -1.9
    health_coef: -1.0
    scale_min: 0.45
    scale_max: 0.85
  expansion:
    scale_min: 0.97
    scale_max: 1.12
  segments:
    enterprise: {arr_median: 120000, arr_sigma: 0.6, seat_price: 900, invoice_months: 3}
    mid-market: {arr_median: 40000, arr_sigma: 0.5, seat_price: 600, invoice_months: 2}
    smb: {arr_median: 9000, arr_sigma: 0.5, seat_price: 360, invoice_months: 1}
    startup: {arr_median: 5000, arr_sigma: 0.5, seat_price: 240, invoice_months: 1}
  salesforce:
    upserts_per_month: 0.08
  zendesk:
    noise_sd: 0.4
    tickets_per_month: 0.125
    health_coef: 0.9
    size_exponent: 0.3
  product:
    noise_sd: 0.3
    dropout: 0.05
  stripe:
    noise_sd: 0.3
    fail_intercept: -3.6
    fail_health_coef: -1.2
    recover_prob: 0.7
  gmail:
    noise_sd: 0.4
    messages_per_month: 0.29
    health_coef: 0.5
  lag:                           # received_at - occurred_at: exponential plus a late tail
    salesforce: {mean_hours: 6, tail_prob: 0.02, tail_days: [1, 4]}
    zendesk: {mean_hours: 4, tail_prob: 0.05, tail_days: [1, 7]}
    product: {mean_hours: 36, tail_prob: 0.05, tail_days: [2, 10]}
    stripe: {mean_hours: 2, tail_prob: 0.02, tail_days: [1, 3]}
    gmail: {mean_hours: 12, tail_prob: 0.05, tail_days: [1, 5]}
