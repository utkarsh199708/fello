# Alembic settings. The database URL is not here: migrations/env.py derives the app_owner URL
# from DATABASE_URL and APP_OWNER_PASSWORD. Run them with `python -m app migrate`, which first
# creates the database and roles as the admin user (app/migrate.py).

[alembic]
script_location = %(here)s/migrations
# Puts the repo root on sys.path, so env.py can import the app package from the alembic CLI too.
prepend_sys_path = %(here)s
path_separator = os
